<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>메모</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --background:#fafafa;
  --foreground:#18181b;
  --card:#ffffff;
  --muted:#f4f4f5;
  --muted-foreground:#71717a;
  --border:#e4e4e7;
  --primary:#18181b;
  --primary-foreground:#fafafa;
  --secondary:#f4f4f5;
  --ring:#18181b;
  --ok:#047857;
  --warn:#b45309;
  --bad:#be123c;
  --radius:10px;
  --shadow:0 1px 2px rgb(24 24 27 / 6%);
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--foreground);
  background:var(--background);
  font-family:"Noto Sans KR",ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:15px;
  line-height:1.55;
}
button,input,textarea{font:inherit;color:inherit}
#appShell{
  min-height:100vh;
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
}
.side{
  border-right:1px solid var(--border);
  background:#f4f4f5;
  padding:20px 14px 28px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.brand{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);margin:0}
.main{padding:28px 36px 64px}
.main-inner{max-width:760px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.03em;margin:0 0 6px;font-weight:700}
.lede{margin:0 0 18px;color:var(--muted-foreground);font-size:14px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
}
.section{font-size:12px;font-weight:600;letter-spacing:.01em;margin:0 0 8px}
label{display:block;margin:8px 0 6px;font-size:12px;color:var(--muted-foreground)}
textarea,input[type="password"],input[type="search"],input[type="text"]{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:8px 10px;
  font-size:14px;
  line-height:1.5;
}
textarea:focus,input:focus{outline:2px solid transparent;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ring)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{
  appearance:none;
  border:1px solid var(--border);
  background:var(--card);
  border-radius:8px;
  padding:7px 12px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  box-shadow:var(--shadow);
}
button:hover{background:var(--secondary)}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
button.primary:hover{background:#27272a}
button.ghost{background:transparent;box-shadow:none}
button:disabled{opacity:.55;cursor:wait}
.badge{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--border);
  border-radius:999px;
  padding:1px 8px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--muted-foreground);
  background:#fff;
}
.badge.ok{color:var(--ok);border-color:#a7f3d0;background:#ecfdf5}
.badge.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}
.badge.bad{color:var(--bad);border-color:#fecdd3;background:#fff1f2}
.meta,.sub{color:var(--muted-foreground);font-size:12px;line-height:1.5;margin:0}
.muted{color:var(--muted-foreground)}
.error{
  white-space:pre-wrap;
  word-break:break-word;
  background:#fff1f2;
  border:1px solid #fecdd3;
  color:#9f1239;
  border-radius:8px;
  padding:10px 12px;
  font-size:13px;
  margin-top:12px;
}
.pool,.results,.log-list{display:grid;gap:8px}
.pool{max-height:220px;overflow:auto}
.log-list{max-height:240px;overflow:auto}
.results{max-height:280px;overflow:auto}
.memo-card,.result,.log-item{
  text-align:left;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  background:#fff;
}
.memo-card{cursor:pointer;width:100%}
.memo-card:hover,.result:hover{border-color:#d4d4d8}
.memo-card p,.result p,.log-item p{margin:6px 0 0;font-size:13px;line-height:1.5}
.memo-head,.result-top,.log-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.rank{color:var(--foreground);font-size:12px;font-weight:600;margin-left:6px}
.score{font-size:12px}
.editor-shell{
  position:relative;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
}
#query{
  position:relative;z-index:1;background:transparent;caret-color:var(--foreground);
  min-height:320px;border:0;box-shadow:none;padding:16px 18px;font-size:16px;line-height:1.7;resize:vertical
}
#query:focus{box-shadow:none}
.rate{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  font-size:13px;
}
.rate > span{font-weight:600;min-width:5em}
.rate button.on.yes{border-color:#6ee7b7;background:#ecfdf5;color:var(--ok)}
.rate button.on.no{border-color:#fda4af;background:#fff1f2;color:var(--bad)}
.empty{color:var(--muted-foreground);font-size:13px;margin:0}
#keyStatus,#pathStatus{display:block;margin-top:8px}
@media (max-width:960px){
  #appShell{grid-template-columns:1fr}
  .side{border-right:0;border-top:1px solid var(--border);order:2}
  .main{padding:20px 16px 32px}
}
</style>
</head>
<body>
<div id="appShell">
  <aside class="side">
    <p class="brand">도구</p>
    <section class="card">
      <div class="section">Keys</div>
      <label for="jevKey">Jev 키. 이 브라우저에만 저장됩니다.</label>
      <input id="jevKey" type="password" autocomplete="off" placeholder="비우면 단어 겹침 순위" />
      <div class="row">
        <button type="button" id="saveKeysBtn">Save local keys</button>
        <button type="button" class="ghost" id="clearKeysBtn">Clear local keys</button>
      </div>
      <span class="meta" id="keyStatus"></span>
      <p class="meta" id="pathStatus"></p>
    </section>
    <section class="card">
      <div class="section">Find related</div>
      <div class="row">
        <button type="button" class="primary" id="findBtn">Find related</button>
        <span class="badge" id="methodBadge">idle</span>
      </div>
      <p class="meta" id="resultMeta" style="margin-top:10px">No search yet.</p>
      <div id="results" class="results"></div>
      <div class="row">
        <button type="button" class="ghost" id="showAllBtn" hidden>Show all</button>
      </div>
      <label for="note">Optional note for this relatedness run</label>
      <textarea id="note" style="min-height:72px" placeholder="순위에서 맞거나 틀린 점"></textarea>
    </section>
    <section class="card">
      <div class="section">Pool · 41 memos</div>
      <label for="poolSearch">Search the pool</label>
      <input id="poolSearch" type="search" placeholder="id or text · m37, 세탁" />
      <p class="meta" id="poolCount" style="margin:8px 0">0 / 0</p>
      <div id="pool" class="pool"></div>
    </section>
    <section class="card">
      <div class="section">Eval log</div>
      <p class="meta">localStorage <code>memoRelatednessEvalLog</code></p>
      <div class="row">
        <button type="button" id="exportJsonBtn">JSON</button>
        <button type="button" id="exportJsonlBtn">JSONL</button>
        <button type="button" class="ghost" id="clearLogBtn">Clear</button>
      </div>
      <div id="logList" class="log-list" style="margin-top:12px"></div>
    </section>
  </aside>
  <main class="main">
    <div class="main-inner">
      <h1>메모</h1>
      <p class="lede">메모를 쓰고, 풀에서 관련된 메모를 찾습니다.</p>
      <label for="query">쓰는 중</label>
      <div class="editor-shell">
        <textarea id="query" placeholder="예: 금오산 케이블카 할인 여부"></textarea>
      </div>
      <div class="row">
        <button type="button" class="ghost" id="clearQueryBtn">Clear pad</button>
      </div>
      <div id="errorBox" class="error" hidden></div>
    </div>
  </main>
</div>
<script src="/phrases.js"></script>
<script src="/relatedness.js"></script>
<script src="/app.js"></script>
</body>
</html>
